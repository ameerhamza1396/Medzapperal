[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/imagekit-auth"
  to = "/.netlify/functions/imagekit-auth"
  status = 200

[[redirects]]
  from = "/api/customer-imagekit-auth"
  to = "/.netlify/functions/customer-imagekit-auth"
  status = 200

[[redirects]]
  from = "/api/imagekit-delete"
  to = "/.netlify/functions/imagekit-delete"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
